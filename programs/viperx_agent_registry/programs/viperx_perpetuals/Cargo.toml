[package]
name = "viperx_perpetuals"
version = "0.1.0"
description = "ViperX on-chain oracle-based perpetual liquidity engine on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "viperx_perpetuals"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
pyth-sdk-solana = "0.10.1"
