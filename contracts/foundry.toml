[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
xlayer_testnet = "https://testrpc.xlayer.tech"
xlayer_mainnet = "https://rpc.xlayer.tech"
base_sepolia = "https://sepolia.base.org"
localhost = "http://127.0.0.1:8545"

[etherscan]
xlayer_testnet = { key = "${OKX_API_KEY:none}", url = "https://www.okx.com/api/v5/explorer/xlayer/testnet" }
xlayer_mainnet = { key = "${OKX_API_KEY:none}", url = "https://www.okx.com/api/v5/explorer/xlayer/mainnet" }
base_sepolia = { key = "${ETHERSCAN_API_KEY:none}", url = "https://api-sepolia.basescan.org/api" }

